<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>GymProg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout : appli mobile sombre. Barre du haut compacte avec le logo JA, navigation en bas sur téléphone et en onglets sur ordinateur, contenu en cartes neutres avec une bande de couleur par niveau de priorité. */
:root{
  --bg:#0e0f12;
  --surface:#16181c;
  --card:#1d2025;
  --line:#2a2e35;
  --text:#eef0f3;
  --muted:#8b929c;
  --accent:#2f80ed;
  --font-display:"Anton","Impact","Arial Narrow",sans-serif;
  --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --prio:#ff6b5e; --mod:#f5b143; --maint:#3ecf8e; --off:#8b929c;
  --ok:#3ecf8e; --low:#ff6b5e; --high:#f5b143;
  --radius:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* barre du haut */
.appbar{position:sticky;top:0;z-index:10;background:rgba(14,15,18,.88);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.appbar-in{max-width:1180px;margin:0 auto;height:60px;padding:0 16px;display:flex;align-items:center;gap:12px}
.mark{width:36px;height:36px;border-radius:9px;display:block;flex:none}
.title{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.title b{font-family:var(--font-display);font-weight:400;font-size:19px;letter-spacing:.6px;text-transform:uppercase}
.save{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.save i{width:6px;height:6px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.save[data-s="ok"] i{background:var(--ok)}
.save[data-s="local"] i{background:var(--low)}
.prof-btn{margin-left:auto;display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px;font-weight:700;font-size:14px;max-width:48%}
.prof-btn #profName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:11.5px;font-weight:800;flex:none;letter-spacing:.3px}

/* navigation */
.wrap{max-width:1180px;margin:0 auto;padding:18px calc(16px + env(safe-area-inset-right)) 40px calc(16px + env(safe-area-inset-left))}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 20px}
.tab{background:none;border:0;padding:10px 12px;color:var(--muted);font-weight:700;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:8px;font-size:14.5px}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.tab.settings{margin-left:auto}
@media (max-width:759px){
  .wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;margin:0;border:0;border-top:1px solid var(--line);background:rgba(22,24,28,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:6px calc(6px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(6px + env(safe-area-inset-left));justify-content:space-around}
  .tab{flex:1;flex-direction:column;gap:3px;font-size:11.5px;padding:6px 4px;border:0;border-radius:10px}
  .tab svg{width:22px;height:22px}
  .tab[aria-selected="true"]{color:var(--accent);background:rgba(47,128,237,.1)}
  .tab.settings{margin-left:0}
}

h2.view-title{font-size:22px;font-weight:800;margin:0 0 4px;letter-spacing:-.2px;text-wrap:balance}
.view-sub{color:var(--muted);margin:0 0 16px;font-size:14px;max-width:62ch}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 10px}
.section-h h3{margin:0;font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:800}

/* résumé */
.summary{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#18202c 0%,var(--surface) 60%);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:6px}
.ring{flex:none;position:relative;width:74px;height:74px}
.ring svg{display:block}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.sum-txt{min-width:0}
.sum-txt strong{display:block;font-size:16px;font-weight:800;margin-bottom:6px}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.stats span b{color:var(--text);font-variant-numeric:tabular-nums}

/* kanban */
.board{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 12px;scroll-snap-type:x proximity;align-items:flex-start;scrollbar-width:thin}
.col{flex:0 0 280px;scroll-snap-align:start;border-radius:var(--radius);padding:10px;min-height:120px;display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line)}
.col.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.col-head{display:flex;align-items:center;gap:8px;padding:2px 2px 4px}
.col-count{color:var(--muted);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.col-range{margin-left:auto;font-size:12px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:2px 8px;font-size:12.5px;font-weight:700;white-space:nowrap;background:rgba(255,255,255,.08);color:var(--text)}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.lv-prio{--lv:var(--prio)} .lv-mod{--lv:var(--mod)} .lv-maint{--lv:var(--maint)} .lv-off{--lv:var(--off)}
.col.lv-prio,.col.lv-mod,.col.lv-maint,.col.lv-off{border-top:3px solid var(--lv)}
.lv-prio .tag,.tag.lv-prio{background:rgba(255,107,94,.15);color:#ff9a90}
.lv-mod .tag,.tag.lv-mod{background:rgba(245,177,67,.15);color:#ffcc75}
.lv-maint .tag,.tag.lv-maint{background:rgba(62,207,142,.14);color:#74e0ad}
.lv-off .tag,.tag.lv-off{background:rgba(139,146,156,.16);color:#b8bec7}
.card{display:block;width:100%;text-align:left;border:1px solid transparent;border-radius:11px;padding:11px 12px;background:var(--card);transition:border-color .15s,transform .12s}
.card:hover{border-color:#3a3f48}
.card:active{transform:scale(.99)}
.card[draggable="true"]{cursor:grab}
.card-title{font-weight:700;font-size:15px;margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.vol{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.vol b{color:var(--text)}
.meter{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.08);position:relative;overflow:hidden}
.meter b{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.st{font-weight:800;font-size:12px;white-space:nowrap}
.st.ok{color:var(--ok)} .st.low{color:var(--low)} .st.high{color:var(--high)} .st.none{color:var(--muted)}
.add{background:none;border:1px dashed var(--line);border-radius:11px;color:var(--muted);text-align:center;padding:9px 4px;font-size:14px;font-weight:700}
.add:hover{color:var(--text);border-color:#3a3f48}

/* séries */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.tile b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{color:var(--muted);font-size:12.5px}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(100px,1.1fr) 2.2fr 64px;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.row:first-child{border-top:0}
.row-name{font-weight:700;display:flex;flex-direction:column;gap:4px}
.row-name .tag{align-self:flex-start;font-size:11.5px}
.track{position:relative;height:14px;border-radius:7px;background:rgba(255,255,255,.05)}
.band{position:absolute;top:0;bottom:0;border-radius:7px;background:rgba(255,255,255,.11)}
.fill{position:absolute;left:0;top:3px;bottom:3px;border-radius:5px}
.row-val{text-align:right;font-variant-numeric:tabular-nums;font-weight:800;font-size:16px}
.row-val small{display:block;font-size:11.5px}
.row-meta{grid-column:2 / 4;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:-4px}
.group-h{padding:9px 14px;font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:800;background:#121418;border-top:1px solid var(--line)}
.group-h:first-child{border-top:0}

/* programme */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:16px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:8px 4px;text-align:center;min-width:0}
.day b{display:block;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:800}
.day span{display:block;font-size:12px;font-weight:700;margin-top:3px;line-height:1.25;hyphens:none;overflow-wrap:normal}
.day.off span{color:#5d636c;font-weight:600}
.day.on{border-color:#2f4b73;background:#152131}
.ex-meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ex-meta b{color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-size:11.5px}
.chip.sec{background:transparent!important;box-shadow:inset 0 0 0 1px currentColor;opacity:.8}
.notes{font-size:12.5px;color:var(--muted);margin:8px 0 0;padding-left:15px}
.notes li{margin:1px 0}
.c-purple{background:rgba(155,120,255,.16);color:#c3adff} .c-blue{background:rgba(47,128,237,.18);color:#8fbcff} .c-amber{background:rgba(245,177,67,.16);color:#ffcc75}
.c-green{background:rgba(62,207,142,.15);color:#74e0ad} .c-red{background:rgba(255,107,94,.16);color:#ff9a90} .c-gray{background:rgba(139,146,156,.18);color:#c3c8cf}
.warm{font-size:12px;color:var(--muted);font-style:italic}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,6,8,.66);display:none;align-items:flex-end;justify-content:center;z-index:30}
.scrim.open{display:flex;animation:fade .15s ease-out}
.sheet{background:#191b20;border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:90%;overflow:auto;padding:10px 18px calc(22px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.sheet::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:#3a3f48;margin:0 auto 14px}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:20px;padding-top:18px}.sheet::before{display:none}}
.sheet h3{margin:0 0 14px;font-size:19px;font-weight:800}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12.5px;color:var(--muted);font-weight:700}
.field input,.field select,.field textarea{background:#111317;border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;font-size:16px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none}
.field textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{border:1px solid var(--line);background:#23262c;border-radius:10px;padding:11px 16px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:#ff9a90;border-color:rgba(255,107,94,.35);background:rgba(255,107,94,.06)}
.btn.ghost{background:none}
.prio-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.prio-pick button{border:2px solid transparent;border-radius:12px;padding:11px 12px;text-align:left;justify-content:flex-start;flex-wrap:wrap}
.prio-pick button::before{display:none}
.prio-pick button[aria-pressed="true"]{border-color:currentColor}
.prio-pick small{display:block;width:100%;font-weight:600;opacity:.8}
.contrib{font-size:13px;color:var(--muted);margin:0;padding-left:16px}
.lvl-row{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;align-items:end}
.empty{color:var(--muted);font-size:13px;padding:6px 4px}
.prof-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.prof-item{display:flex;align-items:center;gap:12px;background:#111317;border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.prof-item .avatar{width:34px;height:34px;font-size:13px;background:#2a2e35}
.prof-item[aria-current="true"]{border-color:var(--accent)}
.prof-item[aria-current="true"] .avatar{background:var(--accent)}
.prof-item > span:nth-child(2){flex:1;min-width:0}
.prof-item small{color:var(--muted);font-size:12px}
.choice{display:grid;gap:8px;margin-bottom:14px}
.choice label{display:flex;gap:10px;align-items:flex-start;background:#111317;border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.choice input{margin-top:3px;accent-color:var(--accent)}
.choice small{display:block;color:var(--muted);font-size:12.5px}

@media (max-width:520px){
  .tiles{gap:8px}.tile{padding:10px 12px}.tile b{font-size:22px}
  .week{grid-template-columns:repeat(7,minmax(58px,1fr));overflow-x:auto;padding-bottom:4px}.day{padding:8px 3px}
  .col{flex-basis:264px}
  h2.view-title{font-size:20px}
}
/* coach */
.btn-an{display:inline-flex;align-items:center;gap:7px;border:1px solid #2f6b4f;background:#13261d;color:#74e0ad;border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px}
.head-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.summary{flex-wrap:wrap}.summary .btn-an{margin-left:auto;flex:none}
@media (max-width:520px){.summary .btn-an{width:100%;justify-content:center;margin-left:0}}
.sugg-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.sugg{background:#111317;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.sugg-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sugg p{margin:4px 0;font-size:13px;color:var(--muted)}
.sugg-meta{font-size:12.5px;color:var(--text);font-weight:700}
.sugg-meta a,.an-item a,.an-src a{color:#8fbcff}
.sugg-act{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.sugg-act select{background:#1b1e23;border:1px solid var(--line);border-radius:8px;padding:7px 8px;flex:1;min-width:120px}
.sugg-act .btn{padding:7px 12px}
.pill{font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;background:rgba(62,207,142,.14);color:#74e0ad}
.an-score{border-radius:12px;padding:12px 14px;margin-bottom:12px;border:1px solid var(--line)}
.an-score b{display:block;font-size:16px}
.an-score span{font-size:13px;color:var(--muted)}
.an-score.good{background:rgba(62,207,142,.08);border-color:rgba(62,207,142,.35)}
.an-score.warn{background:rgba(245,177,67,.07);border-color:rgba(245,177,67,.3)}
.an-item{border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#15171b}
.an-low{border-left-color:var(--low)} .an-high{border-left-color:var(--high)} .an-tip{border-left-color:var(--ok)} .an-info{border-left-color:var(--accent)}
.an-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.an-tag{font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.an-low .an-tag{color:var(--low)} .an-high .an-tag{color:var(--high)} .an-tip .an-tag{color:var(--ok)} .an-info .an-tag{color:#8fbcff}
.an-item p{margin:5px 0 0;font-size:13.5px;color:#c9ced5}
.an-item details,.an-src{margin-top:8px}
.an-item summary,.an-src summary{cursor:pointer;font-weight:700;font-size:13.5px;color:var(--text)}
.an-src{border-top:1px solid var(--line);padding-top:10px;margin:14px 0 6px}
.an-src ul{padding-left:18px;margin:8px 0;font-size:13px}
.an-src li{margin:4px 0}
.an-src p{font-size:12.5px;color:var(--muted);margin:6px 0 0}
/* fiche une page (aperçu, image, impression) */
.head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.btn-fiche{display:inline-flex;align-items:center;gap:7px;flex:none;border:1px solid #2f4b73;background:#152131;color:#8fbcff;border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px}
.fx{position:fixed;inset:0;z-index:40;background:#0b0c0f;display:none;flex-direction:column}
.fx.open{display:flex}
.fx-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.fx-bar .grow{flex:1}
.fx-bar label{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:var(--muted)}
.fx-bar input{accent-color:var(--accent);width:16px;height:16px}
.fx-msg{width:100%;font-size:12.5px;color:var(--high);margin:0}
.fx-msg:empty{display:none}
.fx-body{flex:1;overflow:auto;padding:16px 12px calc(24px + env(safe-area-inset-bottom))}
.fx-scale{transform-origin:top left;margin:0 auto}
#fiche{width:794px;min-height:1123px;background:#fff;color:#14161a;font-family:var(--font-body);font-size:var(--fs,12px);line-height:1.3;padding:30px 32px 26px;box-shadow:0 10px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:calc(var(--fs,12px)*1.05)}
#fiche *{box-sizing:border-box}
.f-head{display:flex;align-items:center;gap:14px;border-bottom:3px solid #14161a;padding-bottom:12px}
.f-head img{width:52px;height:52px;border-radius:12px}
.f-head h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:30px;letter-spacing:.6px;text-transform:uppercase;line-height:1}
.f-head p{margin:4px 0 0;color:#5d636c;font-size:13px;font-weight:600}
.f-head .f-brand{margin-left:auto;text-align:right;font-size:11px;color:#5d636c;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.f-head .f-brand b{display:block;font-family:var(--font-display);font-weight:400;font-size:20px;color:#14161a;letter-spacing:.8px}
.f-week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.f-week div{border:1px solid #d9dce1;border-radius:7px;padding:5px 4px;text-align:center;font-weight:700;font-size:calc(var(--fs,12px)*.95)}
.f-week div small{display:block;font-size:10px;letter-spacing:.7px;color:#7a8089;text-transform:uppercase}
.f-week div.on{background:#eef4fe;border-color:#bcd3f7;color:#1c4f9c}
.f-week div.off{color:#a0a5ad;font-weight:600}
.f-grid{column-count:2;column-gap:16px}
.f-grid .f-sess{margin-bottom:calc(var(--fs,12px)*1.05);display:block}
.f-sess{border:1px solid #d9dce1;border-radius:10px;overflow:hidden;break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid}
.f-sh{display:flex;align-items:baseline;gap:6px;padding:7px 10px;background:var(--c);color:#fff;font-weight:800;text-transform:uppercase;letter-spacing:.4px;font-size:calc(var(--fs,12px)*1.02)}
.f-sh span{margin-left:auto;font-weight:700;text-transform:none;letter-spacing:0;opacity:.9;font-size:calc(var(--fs,12px)*.92)}
.f-sess table{width:100%;border-collapse:collapse}
.f-sess th{text-align:left;font-size:calc(var(--fs,12px)*.78);text-transform:uppercase;letter-spacing:.5px;color:#7a8089;font-weight:800;padding:5px 6px 3px;border-bottom:1px solid #e3e6ea}
.f-sess td{padding:calc(var(--fs,12px)*.36) 6px;border-bottom:1px solid #eef0f2;vertical-align:top}
.f-sess tr:last-child td{border-bottom:0}
.f-sess td.n{text-align:center;white-space:nowrap;font-weight:800;font-variant-numeric:tabular-nums}
.f-sess td.r{text-align:center;white-space:nowrap;color:#4a5058;font-variant-numeric:tabular-nums}
.f-sess th.c{text-align:center}
.f-ex{font-weight:700}
.f-mu{display:block;font-size:calc(var(--fs,12px)*.82);color:#6b717a;font-weight:600}
.f-no{display:block;font-size:calc(var(--fs,12px)*.8);color:#6b717a;font-style:italic;margin-top:1px}
.f-warm td{color:#8a9099}
.f-warm .f-ex{font-weight:600;font-style:italic}
.f-vol{border-top:2px solid #14161a;padding-top:9px;margin-top:auto}
.f-vol h4{margin:0 0 6px;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:#5d636c}
.f-vol div{display:flex;flex-wrap:wrap;gap:4px 6px}
.f-vol span{border:1px solid #d9dce1;border-radius:6px;padding:2px 7px;font-size:calc(var(--fs,12px)*.86);font-weight:700}
.f-vol span i{font-style:normal;color:#6b717a;font-weight:600}
.f-vol span.ok{border-color:#9fdcbf;background:#effaf4}
.f-vol span.low{border-color:#f5b4ad;background:#fff2f0}
.f-vol span.high{border-color:#f3d39b;background:#fff8ec}
.f-foot{display:flex;justify-content:space-between;font-size:10px;color:#9aa0a8;font-weight:600}
@media print{
  @page{size:A4 portrait;margin:0}
  html,body{background:#fff!important}
  body>*:not(#fx){display:none!important}
  #fx{position:static;display:block!important;background:#fff}
  .fx-bar{display:none!important}
  .fx-body{padding:0;overflow:visible}
  .fx-scale{transform:none!important;width:auto!important;height:auto!important}
  #fiche{box-shadow:none;width:210mm;min-height:0;height:297mm;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

<body>
<header class="appbar">
  <div class="appbar-in">
    <img class="mark" src="icon-192.png" alt="" width="36" height="36">
    <div class="title"><b>GymProg</b><span class="save" id="save" data-s="ok"><i></i><span id="saveTxt">Enregistré</span></span></div>
    <button type="button" class="prof-btn" id="profBtn" aria-haspopup="dialog" aria-label="Changer de profil"><span class="avatar" id="profInit">J</span><span id="profName">Jules</span><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>

<main class="wrap">

    <button class="tab" role="tab" id="tab-series" data-view="series"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Séries</button>
    <button class="tab" role="tab" id="tab-programme" data-view="programme"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Programme</button>
    <button class="tab settings" id="settingsBtn" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Réglages</button>
  </nav>
  <section id="view"></section>
</main>

</div>
<div class="scrim" id="scrim" aria-hidden="true"><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>

<script>
(function(){
"use strict";
var DAYS=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
var DAYS_SHORT=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
var COLORS=["purple","blue","amber","green","red","gray"];
var COLOR_NAMES={purple:"Violet",blue:"Bleu",amber:"Ambre",green:"Vert",red:"Rouge",gray:"Gris"};

function uid(){return Math.random().toString(36).slice(2,9)}
function ex(name,sets,reps,rest,main,sec,notes){return {id:uid(),name:name,sets:sets,reps:reps||"",rest:rest||"",main:main||"",sec:sec||"",notes:notes||[]}}

function defaults(){
  return {
    v:1, coef:0.5,
    levels:[
      {id:"prio",name:"Prioritaire",min:12,max:20,desc:"Muscle en retard : volume max, en début de séance"},
      {id:"mod",name:"Modérée",min:6,max:12,desc:"Progression normale"},
      {id:"maint",name:"Maintenance",min:3,max:5,desc:"Garder les acquis"},
      {id:"off",name:"Non ciblé",min:0,max:0,desc:"Travaillé seulement en indirect"}
    ],
    muscles:[
      {id:"epaules",name:"Épaules",level:"prio"},
      {id:"dorsaux",name:"Dorsaux",level:"prio"},
      {id:"pecs",name:"Pectoraux",level:"mod"},
      {id:"biceps",name:"Biceps",level:"mod"},
      {id:"triceps",name:"Triceps",level:"mod"},
      {id:"quads",name:"Quadriceps",level:"mod"},
      {id:"ischios",name:"Ischios",level:"mod"},
      {id:"fessiers",name:"Fessiers",level:"mod"},
      {id:"arriere",name:"Arrière d'épaule",level:"mod"},
      {id:"mollets",name:"Mollets",level:"mod"},
      {id:"abdos",name:"Abdos",level:"mod"},
      {id:"traps",name:"Trapèzes",level:"maint"},
      {id:"adduct",name:"Adducteurs",level:"maint"},
      {id:"avbras",name:"Avant-bras",level:"off"}
    ],
    sessions:[
      {id:"s1",name:"Dos / Épaules",day:0,color:"purple",exercises:[
        ex("Échauffement coiffe des rotateurs",0,"","","","",["Avec élastique ou poulie"]),
        ex("Pull over",2,"15","90-120s","dorsaux","",["Échauffement / pump","Barre EZ ou corde"]),
        ex("Tirage vertical",3,"10","90-120s","dorsaux","biceps",["1 série d'échauffement","Prise pronation largeur d'épaules"]),
        ex("Tirage horizontal unilatéral",2,"10/bras","90-120s","dorsaux","biceps",["Pied en appui du côté où tu travailles","Garde le coude proche du corps"]),
        ex("Élévations latérales haltères",4,"12","90-120s","epaules","",["En rest-pause : repars de zéro en gardant la tension","Retiens la descente"]),
        ex("Élévations latérales uni poulie",2,"8/bras","90-120s","epaules","",["Avec une cuff","Incline-toi légèrement","Tire sur le côté, pas vers le haut, pour ne pas engager les trapèzes"])
      ]},
      {id:"s2",name:"Leg 1",day:1,color:"blue",exercises:[
        ex("Vélo",0,"","","","",["5 min"]),
        ex("Leg curl couché",4,"15","90-120s","ischios","",["Étire / contracte bien","Descente contrôlée, 2 s d'excentrique"]),
        ex("Leg extension",3,"15+12","90-120s","quads","",["1 série de 15 en échauffement / pump + 2 séries de 12","Amplitude contrôlée"]),
        ex("Hack squat",4,"10","120-180s","quads","fessiers",[]),
        ex("Leg press",3,"10","120-180s","quads","adduct",["En unilatéral","Pied légèrement ouvert","Genou vers l'épaule, les adducteurs doivent travailler"]),
        ex("Adducteur",4,"12","90-120s","adduct","",[])
      ]},
      {id:"s3",name:"Push",day:3,color:"amber",exercises:[
        ex("Échauffement coiffe des rotateurs",0,"","","","",["Avec élastique ou poulie"]),
        ex("Peck deck",2,"15","90-120s","pecs","",["Échauffement / pump","Étire / contracte bien"]),
        ex("Développé incliné haltères",3,"10","90-120s","pecs","epaules",["Banc à 15 degrés"]),
        ex("Développé machine assis",3,"10","90-120s","pecs","triceps",[]),
        ex("Développé couché haltères",2,"12","90-120s","pecs","triceps",[]),
        ex("Poulie vis-à-vis",2,"10","90-120s","pecs","",["Poulie basse : focus haut de pec","Poulie au niveau des hanches"]),
        ex("Élévations latérales haltères",4,"10","90-120s","epaules","",[]),
        ex("Extension triceps barre V",3,"12","90-120s","triceps","",[])
      ]},
      {id:"s4",name:"Leg 2",day:4,color:"green",exercises:[
        ex("Vélo",0,"","","","",["5 min"]),
        ex("Leg curl couché",4,"12","90-120s","ischios","",["Étire / contracte bien","Descente contrôlée, 2 s d'excentrique"]),
        ex("Leg curl assis",2,"8","90-120s","ischios","",[]),
        ex("Hip thrust",3,"10","120-180s","fessiers","ischios",[]),
        ex("RDL",4,"10","120-180s","ischios","fessiers",["À la barre","Étire au maximum, contrôle la descente","Dos bien droit, ceinture si tu en as une","Charge modérée selon ton dos"]),
        ex("Abducteur",4,"12","90-120s","fessiers","",[])
      ]},
      {id:"s5",name:"Pull",day:5,color:"red",exercises:[
        ex("Échauffement coiffe des rotateurs",0,"","","","",["5 min"]),
        ex("Pull over",2,"15","90-120s","dorsaux","",["Échauffement / pump"]),
        ex("Tirage horizontal machine",3,"","90-120s","dorsaux","biceps",["Machine Technogym si tu as","En unilatéral","Penche-toi légèrement du côté où tu travailles"]),
        ex("Tirage horizontal prise large",2,"","90-120s","arriere","traps",["Focus trapèzes / arrière d'épaule","Pas de balancier, reste gainé"]),
        ex("Rowing bûcheron",2,"","90-120s","dorsaux","traps",["À tester, selon ton dos"]),
        ex("Reverse pec fly",4,"12","90-120s","arriere","",[]),
        ex("Curl barre EZ",3,"12","90-120s","biceps","",[]),
        ex("Curl marteau",3,"10","90-120s","biceps","avbras",[])
      ]}
    ]
  };
}

var state=defaults();
var view="priorites";

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function fmt(n){n=Math.round(n*10)/10;return (n%1?n.toFixed(1):String(n)).replace(".",",")}
function lvl(id){for(var i=0;i<state.levels.length;i++){if(state.levels[i].id===id)return state.levels[i]}return state.levels[state.levels.length-1]}
function muscle(id){for(var i=0;i<state.muscles.length;i++){if(state.muscles[i].id===id)return state.muscles[i]}return null}
function sessionOf(exId){for(var i=0;i<state.sessions.length;i++){var s=state.sessions[i];for(var j=0;j<s.exercises.length;j++){if(s.exercises[j].id===exId)return {s:s,i:j}}}return null}
function sortedSessions(){return state.sessions.slice().sort(function(a,b){function d(x){return (x.day==null||x.day==="")?9:Number(x.day)}return d(a)-d(b)})}
function rangeTxt(L){if(L.max===0)return "indirect";return L.min+"–"+L.max+" séries"}

function volumes(){
  var v={},per={};
  state.muscles.forEach(function(m){v[m.id]=0;per[m.id]={}});
  state.sessions.forEach(function(s){
    s.exercises.forEach(function(e){
      var n=Number(e.sets)||0; if(!n)return;
      if(v[e.main]!=null){v[e.main]+=n;per[e.main][s.id]=(per[e.main][s.id]||0)+n}
      if(e.sec&&v[e.sec]!=null){var k=n*state.coef;v[e.sec]+=k;per[e.sec][s.id]=(per[e.sec][s.id]||0)+k}
    });
  });
  var out={};
  state.muscles.forEach(function(m){
    var f=0;for(var k in per[m.id]){if(per[m.id][k]>=1)f++}
    out[m.id]={total:v[m.id],freq:f,per:per[m.id]};
  });
  return out;
}
function status(m,val){
  var L=lvl(m.level);
  if(L.max===0)return {k:"none",t:"indirect"};
  if(val<L.min)return {k:"low",t:"Manque "+fmt(L.min-val)};
  if(val>L.max)return {k:"high",t:"Trop +"+fmt(val-L.max)};
  return {k:"ok",t:"OK"};
}
var STC={ok:"var(--ok)",low:"var(--low)",high:"var(--high)",none:"#777"};
function totalSets(){var t=0;state.sessions.forEach(function(s){s.exercises.forEach(function(e){t+=Number(e.sets)||0})});return t}
function sessSets(s){var t=0;s.exercises.forEach(function(e){t+=Number(e.sets)||0});return t}

/* ---------- profils et enregistrement (sur l'appareil) ---------- */
var STORE_KEY="sf-profiles", OLD_KEY="sf-jules";
var store=null;
function blank(){var d=defaults();d.muscles.forEach(function(m){m.level="mod"});d.sessions=[];return d}
function activeProfile(){for(var i=0;i<store.profiles.length;i++){if(store.profiles[i].id===store.active)return store.profiles[i]}return store.profiles[0]}
function setSave(st,t){var el=document.getElementById("save");el.dataset.s=st;document.getElementById("saveTxt").textContent=t}
function persist(){
  try{localStorage.setItem(STORE_KEY,JSON.stringify(store));setSave("ok","Enregistré sur ce téléphone")}
  catch(e){setSave("local","Impossible d'enregistrer : stockage du navigateur indisponible")}
}
function commit(){activeProfile().data=state;persist();render()}
function valid(d){return d&&Array.isArray(d.muscles)&&Array.isArray(d.sessions)&&Array.isArray(d.levels)}
function switchTo(id){store.active=id;var p=activeProfile();store.active=p.id;state=p.data;persist();showName();render()}
function initials(n){var w=String(n).trim().split(/\s+/).filter(Boolean);return ((w[0]||"?").charAt(0)+(w.length>1?w[w.length-1].charAt(0):"")).toUpperCase()}
function showName(){var n=activeProfile().name;document.getElementById("profName").textContent=n;document.getElementById("profInit").textContent=initials(n)}
function addProfile(name,data){var p={id:uid(),name:name,data:data};store.profiles.push(p);switchTo(p.id);return p}
function boot(){
  try{var raw=localStorage.getItem(STORE_KEY);if(raw){var st=JSON.parse(raw);if(st&&Array.isArray(st.profiles)&&st.profiles.length&&st.profiles.every(function(p){return valid(p.data)}))store=st}}catch(e){}
  if(!store){
    var first=defaults();
    try{var old=localStorage.getItem(OLD_KEY);if(old){var o=JSON.parse(old);if(valid(o))first=o}}catch(e){}
    var id=uid();store={active:id,profiles:[{id:id,name:"Jules",data:first}]};
  }
  state=activeProfile().data;store.active=activeProfile().id;
  persist();showName();render();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
}

function openProfiles(){
  var h='<h3>Profils</h3><p class="view-sub" style="margin-bottom:12px">Chaque profil a son propre programme et ses propres priorités. Touche un profil pour l\'ouvrir.</p><div class="prof-list">';
  store.profiles.forEach(function(p){
    var n=0;p.data.sessions.forEach(function(x){x.exercises.forEach(function(e){n+=Number(e.sets)||0})});
    h+='<button type="button" class="prof-item" data-prof="'+p.id+'" aria-current="'+(p.id===store.active)+'"><span class="avatar">'+esc(initials(p.name))+'</span><span><b>'+esc(p.name)+'</b><br><small>'+p.data.sessions.length+' séance'+(p.data.sessions.length>1?'s':'')+' · '+n+' séries / sem</small></span><small>'+(p.id===store.active?'Ouvert':'Ouvrir')+'</small></button>';
  });
  h+='</div><div class="btns"><button class="btn primary" id="pNew" type="button">+ Nouveau profil</button><button class="btn" id="pRename" type="button">Renommer « '+esc(activeProfile().name)+' »</button>'+(store.profiles.length>1?'<button class="btn danger" id="pDel" type="button">Supprimer « '+esc(activeProfile().name)+' »</button>':'')+'<button class="btn ghost" id="pClose" type="button">Fermer</button></div>';
  openSheet(h,function(sh){
    sh.querySelectorAll("[data-prof]").forEach(function(b){b.addEventListener("click",function(){switchTo(b.dataset.prof);closeSheet()})});
    sh.querySelector("#pClose").addEventListener("click",closeSheet);
    sh.querySelector("#pNew").addEventListener("click",newProfile);
    sh.querySelector("#pRename").addEventListener("click",renameProfile);
    var del=sh.querySelector("#pDel");
    if(del)confirmBtn(del,"Confirmer : supprimer ce profil et son programme",function(){
      store.profiles=store.profiles.filter(function(p){return p.id!==store.active});
      switchTo(store.profiles[0].id);closeSheet();
    });
  });
}
function newProfile(){
  var h='<h3>Nouveau profil</h3><div class="field"><label for="npName">Prénom ou nom du programme</label><input id="npName" autocomplete="off" placeholder="Ex. Lucas, Prise de masse…"></div>';
  h+='<div class="field"><label>Point de départ</label></div><div class="choice" role="radiogroup">'+
    '<label><input type="radio" name="npFrom" value="blank" checked><span><b>Programme vierge</b><small>Aucune séance, tous les muscles en Modérée. Tu construis tout.</small></span></label>'+
    '<label><input type="radio" name="npFrom" value="copy"><span><b>Copie de « '+esc(activeProfile().name)+' »</b><small>Même programme et mêmes priorités, à adapter.</small></span></label>'+
    '<label><input type="radio" name="npFrom" value="default"><span><b>Programme de départ</b><small>Le programme Dos / Épaules, Leg 1, Push, Leg 2, Pull.</small></span></label></div>';
  h+='<div class="btns"><button class="btn primary" id="npOk" type="button">Créer le profil</button><button class="btn ghost" id="npCancel" type="button">Annuler</button></div>';
  openSheet(h,function(sh){
    sh.querySelector("#npCancel").addEventListener("click",closeSheet);
    sh.querySelector("#npOk").addEventListener("click",function(){
      var name=sh.querySelector("#npName").value.trim();if(!name){sh.querySelector("#npName").focus();return}
      var from=sh.querySelector('input[name="npFrom"]:checked').value;
      var data=from==="copy"?JSON.parse(JSON.stringify(state)):from==="default"?defaults():blank();
      addProfile(name,data);view="programme";closeSheet();render();
    });
  });
}
function renameProfile(){
  var p=activeProfile();
  openSheet('<h3>Renommer le profil</h3><div class="field"><label for="rnName">Nom</label><input id="rnName" value="'+esc(p.name)+'" autocomplete="off"></div><div class="btns"><button class="btn primary" id="rnOk" type="button">Enregistrer</button><button class="btn ghost" id="rnCancel" type="button">Annuler</button></div>',function(sh){
    sh.querySelector("#rnCancel").addEventListener("click",closeSheet);
    sh.querySelector("#rnOk").addEventListener("click",function(){var n=sh.querySelector("#rnName").value.trim();if(!n)return;p.name=n;persist();showName();closeSheet()});
  });
}

/* ---------- views ---------- */
function render(){
  document.querySelectorAll(".tab").forEach(function(t){t.setAttribute("aria-selected",t.dataset.view===view?"true":"false")});
  var el=document.getElementById("view");
  if(view==="series")el.innerHTML=viewSeries();
  else if(view==="programme")el.innerHTML=viewProgramme();
  else el.innerHTML=viewPriorities();
  bindDnD();
}

function muscleCard(m,V){
  var L=lvl(m.level),val=V[m.id].total,st=status(m,val);
  var pct=L.max?Math.min(100,val/L.max*100):Math.min(100,val*10);

    '<div class="card-title"><span>'+esc(m.name)+'</span><span class="st '+st.k+'">'+esc(st.t)+'</span></div>'+
    '<span class="tag">'+esc(L.name)+'</span>'+
    '<div class="vol"><span><b>'+fmt(val)+'</b> séries</span><span class="meter"><b style="width:'+pct+'%;background:'+STC[st.k]+'"></b></span><span style="color:var(--muted)">'+V[m.id].freq+'×/sem</span></div>'+
  '</button>';
}
function summaryCard(V){
  var tracked=0,ok=0,low=0,high=0;
  state.muscles.forEach(function(m){var k=status(m,V[m.id].total).k;if(k==="none")return;tracked++;if(k==="ok")ok++;else if(k==="low")low++;else high++});
  var pct=tracked?ok/tracked:0,R=30,C=2*Math.PI*R,col=pct>=.8?"var(--ok)":pct>=.5?"var(--high)":"var(--low)";
  var days=state.sessions.filter(function(s){return s.day!==""&&s.day!=null}).length;
  var msg=!tracked?"Ajoute des muscles à suivre":ok===tracked?"Programme équilibré":(low+high)+" muscle"+(low+high>1?"s":"")+" à ajuster";
  return '<div class="summary"><div class="ring"><svg width="74" height="74" viewBox="0 0 74 74" aria-hidden="true"><circle cx="37" cy="37" r="'+R+'" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="8"/><circle cx="37" cy="37" r="'+R+'" fill="none" stroke="'+col+'" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+(C*pct)+' '+C+'" transform="rotate(-90 37 37)"/></svg><b>'+ok+'/'+tracked+'</b></div>'+
    '<div class="sum-txt"><strong>'+msg+'</strong><div class="stats"><span><b>'+fmt(totalSets())+'</b> séries / sem</span><span><b>'+days+'</b> séance'+(days>1?'s':'')+' / sem</span>'+(low?'<span class="st low">'+low+' en manque</span>':'')+(high?'<span class="st high">'+high+' en trop</span>':'')+'</div></div>'+'<button class="btn-an" type="button" data-analyse="1"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Analyser</button>'+'</div>';
}

/* ---------- sheets ---------- */
var scrim=document.getElementById("scrim"),sheet=document.getElementById("sheet"),lastFocus=null;
function openSheet(html,mount){
  lastFocus=document.activeElement;
  sheet.innerHTML=html;scrim.classList.add("open");scrim.setAttribute("aria-hidden","false");
  if(mount)mount(sheet);
  var f=sheet.querySelector("input,select,textarea,button");if(f)f.focus();
}
function closeSheet(){scrim.classList.remove("open");scrim.setAttribute("aria-hidden","true");sheet.innerHTML="";if(lastFocus&&lastFocus.focus)try{lastFocus.focus()}catch(e){}}
scrim.addEventListener("click",function(e){if(e.target===scrim)closeSheet()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&scrim.classList.contains("open"))closeSheet()});
function confirmBtn(btn,label,action){
  btn.addEventListener("click",function(){
    if(btn.dataset.armed){action();return}
    btn.dataset.armed="1";btn.textContent=label;
    setTimeout(function(){if(btn.isConnected){delete btn.dataset.armed;btn.textContent=btn.dataset.orig}},3500);
  });
  btn.dataset.orig=btn.textContent;
}

function muscleOptions(sel,allowNone){
  var h=allowNone?'<option value="">Aucun</option>':'<option value="">Aucun (échauffement)</option>';
  state.levels.forEach(function(L){
    var ms=state.muscles.filter(function(m){return m.level===L.id});if(!ms.length)return;
    h+='<optgroup label="'+esc(L.name)+'">'+ms.map(function(m){return '<option value="'+m.id+'"'+(m.id===sel?' selected':'')+'>'+esc(m.name)+'</option>'}).join("")+'</optgroup>';
  });
  return h;
}

function editMuscle(id,newLevel){
  var isNew=!id, m=isNew?{id:uid(),name:"",level:newLevel||"mod"}:muscle(id);
  if(!m)return;
  var V=volumes(),contrib=[];
  if(!isNew)state.sessions.forEach(function(s){s.exercises.forEach(function(e){var n=Number(e.sets)||0;if(!n)return;if(e.main===m.id)contrib.push(esc(s.name)+' · '+esc(e.name)+' : '+n);else if(e.sec===m.id)contrib.push(esc(s.name)+' · '+esc(e.name)+' : '+fmt(n*state.coef)+' (secondaire)')})});
  var cur=m.level;
  var h='<h3>'+(isNew?'Nouveau muscle':esc(m.name))+'</h3>';
  h+='<div class="field"><label for="mName">Nom</label><input id="mName" value="'+esc(m.name)+'" autocomplete="off"></div>';
  h+='<div class="field"><label>Priorité</label></div><div class="prio-pick">'+state.levels.map(function(L){return '<button type="button" class="tag lv-'+L.id+'" data-pick="'+L.id+'" aria-pressed="'+(L.id===cur)+'">'+esc(L.name)+'<small>'+rangeTxt(L)+'</small></button>'}).join("")+'</div>';
  if(!isNew){
    var st=status(m,V[m.id].total);
    h+='<p style="margin:0 0 6px"><b>'+fmt(V[m.id].total)+' séries effectives</b> · <span class="st '+st.k+'">'+esc(st.t)+'</span> · '+V[m.id].freq+'×/sem</p>';
    h+=contrib.length?'<ul class="contrib">'+contrib.map(function(c){return '<li>'+c+'</li>'}).join("")+'</ul>':'<p class="contrib" style="padding:0">Aucun exercice ne cible ce muscle.</p>';
  }
  var lowBy=0;if(!isNew){var Lm=lvl(m.level);if(Lm.max&&V[m.id].total<Lm.min)lowBy=Lm.min-V[m.id].total}
  if(!isNew&&LIB[m.id])h+='<details style="margin-top:12px"'+(lowBy?' open':'')+'><summary style="cursor:pointer;font-weight:700">'+(lowBy?'Il manque '+fmt(lowBy)+' séries : exercices conseillés':'Exercices conseillés')+'</summary>'+suggestionBlock(m.id,lowBy)+'</details>';
  h+='<div class="btns" style="margin-top:16px"><button class="btn primary" id="mSave" type="button">Enregistrer</button><button class="btn ghost" id="mCancel" type="button">Annuler</button>'+(isNew?'':'<button class="btn danger" id="mDel" type="button">Supprimer</button>')+'</div>';
  openSheet(h,function(sh){
    sh.querySelectorAll("[data-pick]").forEach(function(b){b.addEventListener("click",function(){cur=b.dataset.pick;sh.querySelectorAll("[data-pick]").forEach(function(x){x.setAttribute("aria-pressed",x.dataset.pick===cur?"true":"false")})})});
    sh.querySelector("#mCancel").addEventListener("click",closeSheet);
    if(!isNew&&LIB[m.id])bindSuggestions(sh,m.id,lowBy);
    sh.querySelector("#mSave").addEventListener("click",function(){
      var name=sh.querySelector("#mName").value.trim();if(!name){sh.querySelector("#mName").focus();return}
      m.name=name;m.level=cur;if(isNew)state.muscles.push(m);closeSheet();commit();
    });
    var del=sh.querySelector("#mDel");
    if(del)confirmBtn(del,"Confirmer la suppression",function(){
      state.muscles=state.muscles.filter(function(x){return x.id!==m.id});
      state.sessions.forEach(function(s){s.exercises.forEach(function(e){if(e.main===m.id)e.main="";if(e.sec===m.id)e.sec=""})});
      closeSheet();commit();
    });
  });
}

  h+='</div>';
  openSheet(h,function(sh){

var LOWER={quads:1,ischios:1,fessiers:1,adduct:1,mollets:1};
function regionOf(s){var up=0,lo=0;s.exercises.forEach(function(e){var n=Number(e.sets)||0;if(!e.main||!n)return;if(LOWER[e.main])lo+=n;else if(e.main!=="abdos")up+=n});return lo>up?"lower":up>0?"upper":"any"}
function bestSession(mid){
  var want=LOWER[mid]?"lower":mid==="abdos"?"any":"upper";
  var V=volumes(),per=V[mid]?V[mid].per:{};
  var list=state.sessions.map(function(s){
    var r=regionOf(s),score=sessSets(s);
    if(want!=="any"&&r!==want&&r!=="any")score+=100;
    if(per[s.id]>=1)score+=40;
    return {s:s,score:score};
  }).sort(function(a,b){return a.score-b.score});
  return list.length?list[0].s:null;
}
function sessionTotalFor(s,mid){var t=0;s.exercises.forEach(function(e){var n=Number(e.sets)||0;if(e.main===mid)t+=n;else if(e.sec===mid)t+=n*state.coef});return t}
function hasEx(mid,re){var f=false;state.sessions.forEach(function(s){s.exercises.forEach(function(e){if((e.main===mid)&&re.test(e.name.toLowerCase()))f=true})});return f}
function trainsMain(mid){var f=false;state.sessions.forEach(function(s){s.exercises.forEach(function(e){if(e.main===mid&&Number(e.sets))f=true})});return f}
function suggestFor(mid,missing){
  var lib=LIB[mid]||[];var have={};state.sessions.forEach(function(s){s.exercises.forEach(function(e){have[e.name.toLowerCase()]=1})});
  return lib.filter(function(x){return !have[x.n.toLowerCase()]}).map(function(x){
    var sets=missing?Math.max(2,Math.min(4,Math.ceil(missing))):x.s;
    return {x:x,sets:sets};
  });
}
function addSuggested(mid,x,sets,sessId){
  var s=state.sessions.filter(function(o){return o.id===sessId})[0];if(!s)return;
  s.exercises.push(ex(x.n,sets,x.r,x.rest,mid,x.sec&&muscle(x.sec)?x.sec:"",[x.why]));
  commit();
}
function sessionSelect(id,sel){
  return '<select id="'+id+'" aria-label="Séance où ajouter">'+sortedSessions().map(function(s){return '<option value="'+s.id+'"'+(s.id===sel?' selected':'')+'>'+esc(s.name)+'</option>'}).join("")+'</select>';
}
function suggestionBlock(mid,missing){
  if(!state.sessions.length)return '<p class="contrib" style="padding:0">Crée d\'abord une séance pour pouvoir ajouter des exercices.</p>';

  if(!sug.length)return '<p class="contrib" style="padding:0">Pas d\'autre exercice dans la bibliothèque pour ce muscle : ajoute des séries aux exercices existants.</p>';
  var best=bestSession(mid);
  var h='<div class="sugg-list">';
  sug.forEach(function(o,i){
    h+='<div class="sugg"><div class="sugg-top"><b>'+esc(o.x.n)+'</b>'+(o.x.stretch?'<span class="pill">Position étirée</span>':'')+'</div><p>'+esc(o.x.why)+'</p><div class="sugg-meta">'+o.sets+' × '+esc(o.x.r)+' · '+esc(o.x.rest)+(o.x.src?' · <a href="'+SRC[o.x.src].u+'" target="_blank" rel="noopener">étude</a>':'')+'</div>'+
      '<div class="sugg-act"><span>Ajouter à</span>'+sessionSelect("sg-"+mid+"-"+i,best&&best.id)+'<button class="btn primary" type="button" data-sugg="'+mid+'|'+i+'|'+o.sets+'">Ajouter</button></div></div>';
  });

}
function bindSuggestions(root,mid,missing,after){
  var sug=suggestFor(mid,missing);

      var parts=b.dataset.sugg.split("|"),o=sug[Number(parts[1])];if(!o)return;

}

function analyse(){
  var V=volumes(),items=[];
  var add=function(sev,title,txt,src,mid,missing){items.push({sev:sev,title:title,txt:txt,src:src,mid:mid,missing:missing})};
  if(!state.sessions.length){add("low","Aucune séance","Crée tes séances dans l'onglet Programme, puis relance l'analyse.");return items}
  state.muscles.forEach(function(m){
    var L=lvl(m.level),v=V[m.id].total;if(L.max===0)return;
    if(v<L.min)add("low",m.name+" : il manque "+fmt(L.min-v)+" série"+(L.min-v>=2?"s":""),"Objectif "+L.name+" : "+L.min+" à "+L.max+" séries effectives par semaine. Tu en as "+fmt(v)+"."+(L.min-v<=1.5?" Le plus simple : ajoute 1 série à un exercice existant.":""),"pelland",m.id,L.min-v);
    else if(v>L.max)add("high",m.name+" : "+fmt(v-L.max)+" série"+(v-L.max>=2?"s":"")+" de trop","Au-dessus de "+L.max+" séries pour un muscle en "+L.name+". Retire des séries ou passe le muscle en priorité plus haute si c'est voulu.","pelland",m.id);
  });
  state.sessions.forEach(function(s){
    state.muscles.forEach(function(m){
      var t=sessionTotalFor(s,m.id);
      if(t>11)add("high",m.name+" : "+fmt(t)+" séries dans « "+s.name+" »","Au-delà d'environ 11 séries effectives par séance pour un muscle, les séries en plus n'apportent presque plus rien. Déplace une partie de ces séries vers une autre séance.","remmert");
    });
    var tot=sessSets(s);
    if(tot>26)add("info","« "+s.name+" » est longue : "+tot+" séries","Repère pratique : au-delà de 20 à 25 séries, la fatigue fait baisser la qualité des dernières séries. Pense à répartir sur une autre séance.");
  });
  state.muscles.forEach(function(m){
    var L=lvl(m.level);if(m.level!=="prio"&&m.level!=="mod")return;
    if(V[m.id].total>=L.min&&V[m.id].freq<2)add("info",m.name+" : travaillé 1 seule fois par semaine","À volume égal, la fréquence change peu la prise de muscle. Mais répartir sur 2 séances évite de dépasser le plafond de séries utiles par séance et améliore la qualité des séries.","pelland");
  });
  if(muscle("triceps")&&trainsMain("triceps")&&!hasEx("triceps",/t[eê]te|nuque|overhead|au-dessus|front|skull/))add("tip","Triceps : ajoute une extension au-dessus de la tête","Bras au-dessus de la tête, la longue portion du triceps travaille étirée : environ 1,4 fois plus de croissance qu'avec les extensions à la poulie haute.","maeo23","triceps");
  if(muscle("ischios")&&trainsMain("ischios")&&!hasEx("ischios",/assis|seated/))add("tip","Ischios : préfère le leg curl assis","Hanche fléchie, les ischios sont plus étirés : +14 % de croissance contre +9 % en leg curl couché.","maeo21","ischios");
  if(muscle("mollets")&&trainsMain("mollets")&&!hasEx("mollets",/debout|presse|standing/))add("tip","Mollets : fais-les debout","Les mollets debout font plus grossir les gastrocnémiens que les mollets assis.","kino23","mollets");
  return items;
}
function openAnalyse(){
  var items=analyse(),order={low:0,high:1,tip:2,info:3},label={low:"Manque",high:"À réduire",tip:"Meilleur choix",info:"Conseil"};
  items.sort(function(a,b){return order[a.sev]-order[b.sev]});
  var crit=items.filter(function(i){return i.sev==="low"||i.sev==="high"}).length;
  var h='<h3>Analyse du programme</h3>';
  h+='<div class="an-score '+(crit?'warn':'good')+'"><b>'+(items.length?(crit?crit+' point'+(crit>1?'s':'')+' à corriger':'Programme solide'):'Programme validé')+'</b><span>'+(items.length?items.length+' recommandation'+(items.length>1?'s':'')+' au total, basées sur les études ci-dessous':'Volume, répartition et choix d\'exercices sont dans les clous.')+'</span></div>';
  items.forEach(function(it,i){
    h+='<div class="an-item an-'+it.sev+'"><div class="an-h"><span class="an-tag">'+label[it.sev]+'</span><b>'+esc(it.title)+'</b></div><p>'+esc(it.txt)+(it.src?' <a href="'+SRC[it.src].u+'" target="_blank" rel="noopener">Source</a>':'')+'</p>';
    var dupLow=it.sev==="tip"&&items.some(function(o){return o.sev==="low"&&o.mid===it.mid});
    if(it.mid&&(it.sev==="low"||(it.sev==="tip"&&!dupLow)))h+='<details'+(i<2?' open':'')+'><summary>Exercices conseillés</summary>'+suggestionBlock(it.mid,it.sev==="low"?it.missing:0)+'</details>';
    h+='</div>';
  });
  h+='<details class="an-src"><summary>Études utilisées</summary><ul>'+Object.keys(SRC).map(function(k){return '<li><a href="'+SRC[k].u+'" target="_blank" rel="noopener">'+esc(SRC[k].t)+'</a></li>'}).join("")+'</ul><p>Les fourchettes de séries par priorité restent tes réglages : l\'analyse ne les modifie pas.</p></details>';
  h+='<div class="btns"><button class="btn primary" id="anClose" type="button">Fermer</button><button class="btn" id="anRedo" type="button">Relancer l\'analyse</button></div>';
  openSheet(h,function(sh){
    sh.querySelector("#anClose").addEventListener("click",closeSheet);
    sh.querySelector("#anRedo").addEventListener("click",openAnalyse);

  });
}

var fx=document.getElementById("fx"),fiche=document.getElementById("fiche"),fxScale=document.getElementById("fxScale");

function fitFiche(){
  var notesBox=document.getElementById("fxNotes"),msg="";

    for(var i=0;i<FSIZES.length;i++){fiche.style.setProperty("--fs",FSIZES[i]+"px");if(fiche.scrollHeight<=1124)return true}

function scaleFiche(){

  fxScale.style.transform="scale("+k+")";fxScale.style.width=(794*k)+"px";fxScale.style.height=(fiche.offsetHeight*k)+"px";
  fiche.style.transformOrigin="top left";fxScale.style.transformOrigin="top left";

}

document.getElementById("fxPrint").addEventListener("click",function(){
  var t=fiche.style.transform;fiche.style.transform="none";
  try{window.print()}catch(e){fxMsg("L'impression n'est pas disponible ici : utilise Partager l'image.")}
  setTimeout(function(){fiche.style.transform=t},300);
});
var h2cLoading=null;
function loadH2C(){
  if(window.html2canvas)return Promise.resolve();
  if(h2cLoading)return h2cLoading;
  h2cLoading=new Promise(function(res,rej){var sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";sc.onload=res;sc.onerror=function(){h2cLoading=null;rej()};document.head.appendChild(sc)});
  return h2cLoading;
}
document.getElementById("fxShare").addEventListener("click",function(){
  var btn=this;btn.disabled=true;fxMsg("Création de l'image…");
  loadH2C().then(function(){
    var t=fiche.style.transform;fiche.style.transform="none";
    return (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){
      return window.html2canvas(fiche,{scale:2,backgroundColor:"#ffffff",useCORS:true,logging:false,width:794,height:fiche.scrollHeight,windowWidth:1000});
    }).then(function(canvas){fiche.style.transform=t;return new Promise(function(r){canvas.toBlob(r,"image/png")})},function(e){fiche.style.transform=t;throw e});
  }).then(function(blob){
    var name="gymprog-"+activeProfile().name.toLowerCase().replace(/[^a-z0-9]+/gi,"-")+".png";
    var file=null;try{file=new File([blob],name,{type:"image/png"})}catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      return navigator.share({files:[file],title:"Programme "+activeProfile().name}).then(function(){fxMsg("")},function(){fxMsg("")});
    }
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);fxMsg("Image téléchargée.");
  }).catch(function(){fxMsg("Impossible de créer l'image. Vérifie ta connexion la première fois, ou fais une capture d'écran.")})
  .then(function(){btn.disabled=false});
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&fx.classList.contains("open"))closeFiche()});

/* ---------- events ---------- */
document.getElementById("view").addEventListener("click",function(ev){
  if(ev.target.closest("#openFiche")){openFiche();return}
  if(ev.target.closest("[data-analyse]")){openAnalyse();return}
  var t=ev.target.closest("[data-muscle],[data-addmuscle],[data-ex],[data-addex],[data-editsession],#addSession");
  if(!t)return;
  if(t.dataset.muscle)editMuscle(t.dataset.muscle);
  else if(t.dataset.addmuscle)editMuscle(null,t.dataset.addmuscle);
  else if(t.dataset.ex)editExercise(t.dataset.ex);
  else if(t.dataset.addex)editExercise(null,t.dataset.addex);
  else if(t.dataset.editsession)editSession(t.dataset.editsession);
  else if(t.id==="addSession")editSession(null);
});
document.getElementById("settingsBtn").addEventListener("click",editSettings);
document.getElementById("profBtn").addEventListener("click",openProfiles);
document.querySelectorAll(".tab").forEach(function(t){t.addEventListener("click",function(){view=t.dataset.view;try{history.replaceState(null,"","#"+view)}catch(e){location.hash=view}render()})});
function fromHash(){var h=(location.hash||"").replace("#","");if(h==="series"||h==="programme"||h==="priorites"){view=h;render()}}
window.addEventListener("hashchange",fromHash);

function bindDnD(){
  var dragId=null,kind=null;
  document.querySelectorAll('#view [draggable="true"]').forEach(function(c){
    c.addEventListener("dragstart",function(e){dragId=c.dataset.muscle||c.dataset.ex;kind=c.dataset.muscle?"m":"e";try{e.dataTransfer.setData("text/plain",dragId);e.dataTransfer.effectAllowed="move"}catch(x){}});
  });
  document.querySelectorAll("#view .col[data-level],#view .col[data-session]").forEach(function(col){
    col.addEventListener("dragover",function(e){if(!dragId)return;if((kind==="m"&&col.dataset.level)||(kind==="e"&&col.dataset.session)){e.preventDefault();col.classList.add("drop")}});
    col.addEventListener("dragleave",function(){col.classList.remove("drop")});
    col.addEventListener("drop",function(e){
      e.preventDefault();col.classList.remove("drop");
      if(kind==="m"&&col.dataset.level){var m=muscle(dragId);if(m&&m.level!==col.dataset.level){m.level=col.dataset.level;commit()}}
      else if(kind==="e"&&col.dataset.session){var f=sessionOf(dragId);if(f&&f.s.id!==col.dataset.session){var it=f.s.exercises.splice(f.i,1)[0];state.sessions.forEach(function(s){if(s.id===col.dataset.session)s.exercises.push(it)});commit()}}
      dragId=null;
    });
  });
}

fromHash();
boot();
})();
</script>
